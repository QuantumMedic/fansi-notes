name: 讀取公開 Podcast RSS（唯讀預覽，不部署）
on:
  workflow_dispatch:
  schedule:
    - cron: '23 22 * * *'
permissions:
  contents: read
concurrency:
  group: podcast-rss-sync
  cancel-in-progress: false
env:
  ASTRO_TELEMETRY_DISABLED: 1
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run sync:podcast
      - run: npm run check && npm run build && npm test
      - uses: actions/upload-artifact@v4
        with:
          name: podcast-review
          path: |
            dist
            src/data/podcast.json
