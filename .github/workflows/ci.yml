name: 網站驗證
on:
  pull_request:
  push:
    branches: [main]
env:
  ASTRO_TELEMETRY_DISABLED: 1
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: site-build-review-only
          path: dist
